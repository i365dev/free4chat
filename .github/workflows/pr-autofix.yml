name: PR Autofix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app/**"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/pr-autofix.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: pr-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Format & lint autofix
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: app

      - name: Apply deterministic frontend fixes
        run: |
          npx prettier --write .
          yarn lint
        working-directory: app

      - name: Sync Task / Live View docs assets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("AGENTS.md")
          text = path.read_text()
          old = '`/mcp` is a stateless MCP v2 endpoint built with `createMcpHandler` from `agents/mcp/server` and `McpServer` from `@modelcontextprotocol/server`. It exposes seventeen tools — `room_info`, `read_room_context`, `join_room`, `create_room`, `wait_for_events`, `send_text`, `update_capabilities`, `update_runtime_host`, `send_collab_request`, `send_collab_response`, `send_collab_result`, `send_attachment`, `publish_surface`, `clear_surface`, `read_surface`, `read_attachment`, and `leave_room`; `app/public/agent.md` is the canonical contract.'
          new = '`/mcp` is a stateless MCP v2 endpoint built with `createMcpHandler` from `agents/mcp/server` and `McpServer` from `@modelcontextprotocol/server`. It exposes eighteen tools — `room_info`, `read_room_context`, `join_room`, `create_room`, `wait_for_events`, `send_text`, `update_capabilities`, `update_runtime_host`, `send_collab_request`, `send_collab_response`, `send_collab_result`, `send_attachment`, `publish_surface`, `clear_surface`, `read_surface`, `read_attachment`, `publish_live_view`, and `leave_room`; `app/public/agent.md` is the canonical contract.'
          if old not in text:
              raise SystemExit("expected AGENTS.md MCP tool paragraph not found")
          path.write_text(text.replace(old, new, 1))
          PY
          yarn docs:generate
        working-directory: .

      - name: Commit fixes when needed
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "free4chat-autofix[bot]"
          git config user.email "free4chat-autofix[bot]@users.noreply.github.com"
          git add app AGENTS.md
          git commit -m "docs: regenerate discovery assets"
          git push origin "HEAD:$HEAD_REF"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate autofixed head
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref "$HEAD_REF"
