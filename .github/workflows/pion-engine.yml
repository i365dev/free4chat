name: Pion Engine

on:
  push:
    branches: ["**"]
    paths:
      - "experiments/pion-cloudflare/**"
      - ".github/workflows/pion-engine.yml"
  pull_request:
    paths:
      - "experiments/pion-cloudflare/**"
      - ".github/workflows/pion-engine.yml"

jobs:
  engine:
    name: Pion Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: experiments/pion-cloudflare/go.mod
      - name: Vet
        run: go vet ./...
        working-directory: experiments/pion-cloudflare
      - name: Test (CGO disabled)
        run: CGO_ENABLED=0 go test ./...
        working-directory: experiments/pion-cloudflare
      - name: Build (CGO disabled)
        run: CGO_ENABLED=0 go build ./...
        working-directory: experiments/pion-cloudflare
