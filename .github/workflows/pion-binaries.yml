name: Pion Binaries

# Version-matched Pion media engine release. Runtime releases call this
# workflow with the exact tagged source SHA; the tag trigger remains a repair
# path for an already tagged version.
on:
  push:
    tags:
      - "pion-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Runtime/Pion version
        required: true
        type: string
      source_sha:
        description: Exact source commit to build
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Runtime/Pion version
        required: true
        type: string
      source_sha:
        description: Exact source commit to build
        required: true
        type: string

permissions:
  contents: write

env:
  REQUESTED_VERSION: ${{ inputs.version || '' }}
  REQUESTED_SOURCE_SHA: ${{ inputs.source_sha || '' }}

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate version and source
        id: metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then version="${TAG_NAME#pion-v}"; fi
          source_sha="$REQUESTED_SOURCE_SHA"
          if [ -z "$source_sha" ]; then source_sha="$GITHUB_SHA"; fi
          package_version="$(node -p "require('./agent-runtime/package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "Pion version $version does not match agent-runtime/package.json $package_version" >&2
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$source_sha" ]; then
            echo "Checked out $checked_out_sha, expected source SHA $source_sha" >&2
            exit 1
          fi
          case "$version" in
            *[!0-9A-Za-z.+-]*|"") echo "Invalid release version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, goos: darwin, goarch: arm64, nodearch: arm64 }
          - { os: macos-15-intel, goos: darwin, goarch: amd64, nodearch: x64 }
          - { os: ubuntu-22.04, goos: linux, goarch: amd64, nodearch: x64 }
          - { os: ubuntu-22.04-arm, goos: linux, goarch: arm64, nodearch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        working-directory: experiments/pion-cloudflare
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          go build -trimpath -ldflags "-s -w" \
            -o "../../dist/pion-${VERSION}-${{ matrix.goos }}-${{ matrix.nodearch }}" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pion-${{ matrix.goos }}-${{ matrix.nodearch }}
          path: dist/pion-*
          if-no-files-found: error

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 1
      - name: Ensure and verify exact source tag
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          tag="pion-v${VERSION}"
          resolve_tag_commit() {
            local direct_sha peeled_sha
            direct_sha="$(git ls-remote --refs origin "refs/tags/${tag}" | awk 'NR==1 {print $1}')"
            peeled_sha="$(git ls-remote origin "refs/tags/${tag}^{}" | awk 'NR==1 {print $1}')"
            if [ -n "$direct_sha" ]; then
              printf '%s\n' "${peeled_sha:-$direct_sha}"
            fi
          }

          existing_sha="$(resolve_tag_commit)"
          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" != "$SOURCE_SHA" ]; then
              echo "$tag already points to $existing_sha, expected $SOURCE_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$SOURCE_SHA" \
              -m "Release Pion binaries for Agent Runtime ${VERSION}"
            if ! git push origin "refs/tags/${tag}"; then
              # Another run may have created the tag after our initial check.
              # Accept that race only when the remote tag resolves exactly to
              # this source; never force-update or overwrite a tag.
              git tag -d "$tag" >/dev/null 2>&1 || true
              existing_sha="$(resolve_tag_commit)"
              if [ "$existing_sha" != "$SOURCE_SHA" ]; then
                echo "Could not create $tag at $SOURCE_SHA; remote resolves to ${existing_sha:-nothing}" >&2
                exit 1
              fi
            fi
          fi

          resolved_sha="$(resolve_tag_commit)"
          if [ "$resolved_sha" != "$SOURCE_SHA" ]; then
            echo "$tag resolves to ${resolved_sha:-nothing}, expected $SOURCE_SHA" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
      - name: Verify all assets and generate SHA256SUMS
        working-directory: release-assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for asset in "pion-${VERSION}-darwin-arm64" "pion-${VERSION}-darwin-x64" "pion-${VERSION}-linux-arm64" "pion-${VERSION}-linux-x64"; do
            test -s "$asset"
          done
          sha256sum pion-* > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pion-v${{ needs.metadata.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            release-assets/pion-*
            release-assets/SHA256SUMS

  smoke:
    needs: [metadata, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, goos: darwin, goarch: arm64 }
          - { os: macos-15-intel, goos: darwin, goarch: x64 }
          - { os: ubuntu-22.04, goos: linux, goarch: x64 }
          - { os: ubuntu-22.04-arm, goos: linux, goarch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 1
      - name: Checkout smoke harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .smoke-tools
          sparse-checkout: agent-runtime/scripts/smoke-pion-release.mjs
          sparse-checkout-cone-mode: false
      - name: Verify smoke source revisions
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          TOOLS_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C .smoke-tools rev-parse HEAD)" = "$TOOLS_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json
      - name: Install Runtime dependencies
        run: npm ci
        working-directory: agent-runtime
      - name: Build Runtime
        run: npm run build
        working-directory: agent-runtime
      - name: Stage smoke harness
        run: |
          set -euo pipefail
          mkdir -p agent-runtime/scripts
          cp .smoke-tools/agent-runtime/scripts/smoke-pion-release.mjs \
            agent-runtime/scripts/smoke-pion-release.mjs
      - name: Smoke-test public release download and cache reuse
        env:
          PION_SMOKE_VERSION: ${{ needs.metadata.outputs.version }}
          PION_SMOKE_OS: ${{ matrix.goos }}
          PION_SMOKE_ARCH: ${{ matrix.goarch }}
        run: node agent-runtime/scripts/smoke-pion-release.mjs
