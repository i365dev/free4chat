name: Agent Runtime

on:
  push:
    paths:
      - "agent-runtime/**"
      - ".github/workflows/agent-runtime.yml"
  pull_request:
    paths:
      - "agent-runtime/**"
      - ".github/workflows/agent-runtime.yml"

jobs:
  agent-runtime:
    name: Agent Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-runtime/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agent-runtime

      - name: Prettier
        run: npm run format:check
        working-directory: agent-runtime

      - name: ESLint
        run: npm run lint
        working-directory: agent-runtime

      - name: Type check
        run: npm run type-check
        working-directory: agent-runtime

      - name: Build
        run: npm run build
        working-directory: agent-runtime

      - name: Test
        run: npm test
        working-directory: agent-runtime

      - name: Package check
        run: npm run pack:check
        working-directory: agent-runtime
